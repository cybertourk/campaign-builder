<!DOCTYPE html>
<html lang="en" class="dark" data-theme="stone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealmForge — System-Agnostic Campaign Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#172033',
              950: '#0b1120',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="rpg-stone-body text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Top Navigation (Full Widescreen Container on Desktop) -->
  <header class="rpg-topbar backdrop-blur sticky top-0 z-20">
    <div class="max-w-[1780px] w-full mx-auto px-3 sm:px-6 xl:px-8 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="rpg-slot-small w-9 h-9 sm:w-10 sm:h-10 p-1 shrink-0">
          <img src="./GUI_Fantasy_RPG_Kit/papyrus-icon.png"
               data-parchment-src="./Parchwood_UI_Kit/102-rolled-treasure-map-with-a-dotted-route-and-small-crimson-X-blank-margins.png"
               alt="RealmForge" class="w-6 h-6 sm:w-7 sm:h-7 object-contain" onerror="this.style.display='none'" />
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-rpg-display font-bold text-base sm:text-lg tracking-wide text-amber-100 truncate">RealmForge</span>
            <span class="rpg-slot-long hidden md:inline-flex text-[11px] font-medium px-2.5 py-0.5 rounded-full text-amber-200/90">
              Campaign Planner
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
        <div id="settings-btn-slot"></div>
        <div id="theme-toggle-slot"></div>
        <div id="auth-status" class="flex items-center gap-2 sm:gap-3"></div>
      </div>
    </div>
  </header>

  <!-- Dynamic Application Mount Point (Spreads Across Wide PC Screens) -->
  <main id="app-main" class="flex-1 max-w-[1780px] w-full mx-auto px-3 sm:px-6 xl:px-8 py-4 sm:py-7"></main>

  <script type="module" src="./main.js"></script>
</body>
</html>
