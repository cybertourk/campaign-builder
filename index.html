<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealmForge — System-Agnostic Campaign Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#172033',
              950: '#0b1120',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Top Navigation -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i data-lucide="compass" class="w-5 h-5 text-white"></i>
        </div>
        <span class="font-bold text-lg tracking-tight">RealmForge</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Campaign Builder</span>
      </div>

      <div id="auth-status" class="flex items-center gap-3"></div>
    </div>
  </header>

  <!-- Dynamic Application Mount Point -->
  <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8"></main>

  <script type="module" src="./main.js"></script>
</body>
</html>
